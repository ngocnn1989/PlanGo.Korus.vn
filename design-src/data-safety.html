<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<style>
  .zone { position: absolute; left: 60px; top: 70px; width: 560px; height: 580px; border-radius: 24px; border: 2px solid #BFDBFE; background: rgba(219,234,254,.45); }
  .zone .lbl { position: absolute; top: 18px; left: 24px; font-size: 18px; font-weight: 800; color: #1D4ED8; }
  .box { position: absolute; background: #fff; border: 1px solid #CBD5E1; border-radius: 16px; box-shadow: 0 10px 26px rgba(15,23,42,.10); padding: 16px; text-align: center; font-size: 15px; font-weight: 700; color: #1F2933; }
  .box small { display: block; font-weight: 600; color: #475569; font-size: 13px; margin-top: 4px; }
  .cloud small { display: block; font-weight: 600; font-size: 13px; margin-top: 4px; }
  .cloud { position: absolute; right: 50px; top: 120px; width: 230px; padding: 18px; border-radius: 18px; border: 2px dashed #94A3B8; background: #fff; text-align: center; font-size: 15px; font-weight: 700; color: #475569; }
  .arrow { position: absolute; height: 0; border-top: 3px dashed #94A3B8; }
  svg { display: block; margin: 0 auto 8px; }
</style></head>
<body><div class="canvas bg-soft">
  <div class="zone"><div class="lbl">Tại nhà máy</div></div>
  <div class="box" style="left:110px;top:150px;width:200px">
    <svg width="72" height="62" viewBox="0 0 72 62"><path d="M4 58V26l16 10V26l16 10V26l16 10V8h14v50z" fill="#1F2933"/><rect x="12" y="44" width="8" height="8" fill="#93C5FD"/><rect x="28" y="44" width="8" height="8" fill="#93C5FD"/><rect x="44" y="44" width="8" height="8" fill="#93C5FD"/></svg>

    Dữ liệu kế hoạch &amp; tiến độ<small>Lưu trên máy · có sao lưu · xác nhận trước khi ghi</small>
  </div>
  <div class="arrow" style="left:620px;top:200px;width:110px"></div>
  <div class="cloud">
    <svg width="64" height="44" viewBox="0 0 64 44"><path d="M50 40H16A12 12 0 0 1 14 16 16 16 0 0 1 44 12a12 12 0 0 1 6 28z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/></svg>
    Trợ lý AI<small>Chỉ nhận nội dung trao đổi trong khung chat</small>
  </div>
  <div class="demo-tag">Minh họa</div>
</div></body></html>
