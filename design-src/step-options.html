<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<style>
  .wrap { position: absolute; inset: 0 40px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; align-content: center; align-items: start; }
  .opt { padding: 24px 20px; }
  .opt.rec { border: 2px solid #2563EB; box-shadow: 0 16px 36px rgba(37,99,235,.22); transform: translateY(-14px); }
  .hd { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .hd b { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-size: 18px; }
  .name { font-size: 19px; font-weight: 800; line-height: 1.3; min-height: 46px; margin-bottom: 12px; }
  .crit { font-size: 15px; color: #475569; margin-top: 14px; display: flex; justify-content: space-between; }
  .score { margin-top: 6px; height: 10px; }
  .tot { margin-top: 16px; padding-top: 12px; border-top: 1px solid #E2E8F0; display: flex; justify-content: space-between; align-items: center; font-weight: 800; }
</style></head>
<body><div class="canvas bg-soft">
  <div class="wrap" id="w"></div>
  <div class="demo-tag">Dữ liệu minh họa</div>
</div>
<script>
const crit = ['Đúng hạn giao','Cân bằng tải chuyền','Ít ngày chuyền chờ việc','Ít giờ tăng ca','Ít tách đơn','Hoàn thành đồng bộ'];
const opts = [
  { c: 'A', col: '#94A3B8', name: 'Ít xáo trộn kế hoạch đang chạy', s: [78, 58, 62, 80, 92, 55] },
  { c: 'B', col: '#2563EB', name: 'Cân bằng tải toàn phân xưởng', s: [90, 92, 88, 76, 74, 84], rec: true },
  { c: 'C', col: '#16A34A', name: 'Ưu tiên kịp hạn giao', s: [96, 70, 72, 52, 66, 70] },
];
document.getElementById('w').innerHTML = opts.map((o) => `
  <div class="card opt ${o.rec ? 'rec' : ''}">
    <div class="hd"><b style="background:${o.col}">${o.c}</b>${o.rec ? '<span class="chip green">Đề xuất</span>' : ''}</div>
    <div class="name">${o.name}</div>
    ${crit.map((k, i) => `<div class="crit"><span>${k}</span></div><div class="score"><i style="width:${o.s[i]}%;background:${o.col}"></i></div>`).join('')}
    <div class="tot"><span>Chọn phương án</span><span class="chip ${o.rec ? '' : 'gray'}">${o.c}</span></div>
  </div>`).join('');
</script></body></html>
